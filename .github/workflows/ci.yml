name: CI

on:
  push:
    branches: ["main", "dev", "pre-release", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build · vet · swarm tests · dep-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Cross-compile gate (windows/amd64)
        # Seconds on the same runner; catches any reintroduced unix-only
        # syscall usage (Setpgid/Kill/Setsid belong in pkg/common/proc).
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
      - name: Swarm unit tests
        run: go test -race ./internal/swarm/...
      - name: dep-check (multi-agent oracle)
        run: bash scripts/depcheck.sh

  windows:
    name: Windows build · vet · tests
    runs-on: windows-latest
    # Required since the WIN-7 bring-up triage got the full suite green
    # (2026-06-12) — a red here blocks the PR like any other job.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...

  web:
    name: Web SPA build (web2 / FE v2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24: strips TypeScript types natively, so the `node --test` lib
          # suite runs .test.ts without a flag.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web2/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + build SPA
        run: npm run build
      - name: Unit tests (lib + stores)
        run: npm test
      - name: Verify vendored dist/ is current
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::web2/dist is stale — run 'npm run build' in web2/ and commit dist/."
            git --no-pager diff --stat -- dist
            exit 1
          fi
